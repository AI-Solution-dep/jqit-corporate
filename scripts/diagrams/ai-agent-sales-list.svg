<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#ffffff"/>
  <g font-family="Hiragino Sans, Noto Sans JP, sans-serif">
    <rect x="80" y="72" width="24" height="4" fill="#e60012"/>
    <text x="120" y="86" font-size="26" fill="#6b6b67" letter-spacing="6.2"
          font-family="JetBrains Mono, Menlo, ui-monospace, monospace">AI AGENT — SALES LIST</text>

    <text x="80" y="182" font-size="46" fill="#14140f">成約確度の高い順に並んだリストが、</text>
    <text x="80" y="244" font-size="46" fill="#14140f">毎日Excelで届く</text>

    <rect x="80" y="360" width="340" height="380" rx="4" fill="#faf9f7" stroke="#e7e5e0" stroke-width="2"/>
    <text x="112" y="422" font-size="24" fill="#6b6b67" letter-spacing="2.9"
          font-family="JetBrains Mono, Menlo, ui-monospace, monospace">SOURCE</text>
    <text x="112" y="492" font-size="34" fill="#14140f">Web検索・HP解析</text>
    <text x="112" y="554" font-size="34" fill="#14140f">Googleビジネス</text>
    <text x="112" y="616" font-size="34" fill="#14140f">プレスリリース</text>
    <text x="112" y="678" font-size="34" fill="#14140f">求人情報</text>

    <path d="M440 550 L500 550" stroke="#6b6b67" stroke-width="2"/>
    <path d="M492 542 L506 550 L492 558 Z" fill="#6b6b67"/>

    <rect x="526" y="360" width="740" height="380" rx="4" fill="#ffffff" stroke="#e60012" stroke-width="2"/>
    <text x="558" y="422" font-size="24" fill="#e60012" letter-spacing="2.9"
          font-family="JetBrains Mono, Menlo, ui-monospace, monospace">AI AGENT</text>

    <text x="558" y="500" font-size="34" fill="#14140f">企業情報を自動収集</text>
    <text x="558" y="554" font-size="28" fill="#6b6b67">HP更新頻度・広告タグ</text>
    <text x="558" y="630" font-size="52" fill="#e60012">20項目</text>

    <line x1="900" y1="450" x2="900" y2="680" stroke="#e7e5e0" stroke-width="2"/>

    <text x="936" y="500" font-size="34" fill="#14140f">独自スコアで評価</text>
    <text x="936" y="554" font-size="28" fill="#6b6b67">適合度・成熟度ほか</text>
    <text x="936" y="630" font-size="52" fill="#e60012">4軸</text>
    <text x="558" y="696" font-size="28" fill="#6b6b67">「伸びしろのある企業」を検出する設計</text>

    <path d="M1286 550 L1346 550" stroke="#6b6b67" stroke-width="2"/>
    <path d="M1338 542 L1352 550 L1338 558 Z" fill="#6b6b67"/>

    <rect x="1372" y="360" width="148" height="380" rx="4" fill="#14140f"/>
    <text x="1446" y="530" font-size="36" fill="#ffffff" text-anchor="middle">Excel</text>
    <text x="1446" y="586" font-size="28" fill="#f2f1ee" text-anchor="middle">毎日</text>

    <rect x="80" y="790" width="400" height="78" rx="4" fill="#faf9f7" stroke="#e7e5e0" stroke-width="2"/>
    <text x="280" y="840" font-size="30" fill="#14140f" text-anchor="middle">毎日自動で生成</text>
    <rect x="510" y="790" width="490" height="78" rx="4" fill="#faf9f7" stroke="#e7e5e0" stroke-width="2"/>
    <text x="755" y="840" font-size="30" fill="#14140f" text-anchor="middle">そのまま営業フローへ</text>
    <rect x="1030" y="790" width="490" height="78" rx="4" fill="#faf9f7" stroke="#e7e5e0" stroke-width="2"/>
    <text x="1275" y="840" font-size="30" fill="#14140f" text-anchor="middle">評価の重みは調整可能</text>
  </g>
