<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#ffffff"/>
  <g font-family="Hiragino Sans, Noto Sans JP, sans-serif">
    <rect x="80" y="72" width="24" height="4" fill="#e60012"/>
    <text x="120" y="86" font-size="26" fill="#6b6b67" letter-spacing="6.2"
          font-family="JetBrains Mono, Menlo, ui-monospace, monospace">AI SUPPORT — INCIDENT RESPONSE</text>

    <text x="80" y="182" font-size="46" fill="#14140f">AIは判断を代替せず、</text>
    <text x="80" y="244" font-size="46" fill="#14140f">根拠を添えて教員の判断を支える</text>

    <!-- 教員の対応フロー -->
    <text x="80" y="322" font-size="24" fill="#6b6b67" letter-spacing="2.9"
          font-family="JetBrains Mono, Menlo, ui-monospace, monospace">TEACHER</text>

    <rect x="80" y="348" width="320" height="96" rx="4" fill="#faf9f7" stroke="#e7e5e0" stroke-width="2"/>
    <text x="240" y="406" font-size="34" fill="#14140f" text-anchor="middle">事前準備</text>
    <rect x="453" y="348" width="320" height="96" rx="4" fill="#faf9f7" stroke="#e7e5e0" stroke-width="2"/>
    <text x="613" y="406" font-size="34" fill="#14140f" text-anchor="middle">聞き取り実施</text>
    <rect x="827" y="348" width="320" height="96" rx="4" fill="#faf9f7" stroke="#e7e5e0" stroke-width="2"/>
    <text x="987" y="406" font-size="34" fill="#14140f" text-anchor="middle">判断・対応</text>
    <rect x="1200" y="348" width="320" height="96" rx="4" fill="#faf9f7" stroke="#e7e5e0" stroke-width="2"/>
    <text x="1360" y="406" font-size="34" fill="#14140f" text-anchor="middle">報告書の作成</text>

    <!-- AIが支援する接続（上向き） -->
    <g stroke="#e60012" stroke-width="3" stroke-dasharray="8 8">
      <path d="M240 520 L240 466"/><path d="M613 520 L613 466"/>
      <path d="M987 520 L987 466"/><path d="M1360 520 L1360 466"/>
    </g>
    <g fill="#e60012">
      <path d="M232 470 L240 456 L248 470 Z"/><path d="M605 470 L613 456 L621 470 Z"/>
      <path d="M979 470 L987 456 L995 470 Z"/><path d="M1352 470 L1360 456 L1368 470 Z"/>
    </g>

    <!-- AIの支援 -->
    <rect x="80" y="520" width="1440" height="216" rx="4" fill="#ffffff" stroke="#e60012" stroke-width="2"/>
    <text x="112" y="570" font-size="24" fill="#e60012" letter-spacing="2.9"
          font-family="JetBrains Mono, Menlo, ui-monospace, monospace">AI SUPPORT</text>

    <text x="240" y="646" font-size="34" fill="#14140f" text-anchor="middle">質問項目を自動生成</text>
    <text x="240" y="696" font-size="28" fill="#6b6b67" text-anchor="middle">対象者・分類ごと</text>
    <text x="613" y="646" font-size="34" fill="#14140f" text-anchor="middle">証言を横並びで比較</text>
    <text x="613" y="696" font-size="28" fill="#6b6b67" text-anchor="middle">文字起こし・話者分離</text>
    <text x="987" y="646" font-size="34" fill="#14140f" text-anchor="middle">不足と重大事態を検出</text>
    <text x="987" y="696" font-size="28" fill="#6b6b67" text-anchor="middle">法的根拠つきで警告</text>
    <text x="1360" y="646" font-size="34" fill="#14140f" text-anchor="middle">報告書をPDF出力</text>
    <text x="1360" y="696" font-size="28" fill="#6b6b67" text-anchor="middle">指定の書式で自動</text>

    <!-- 納品物と前提 -->
    <rect x="80" y="790" width="400" height="78" rx="4" fill="#14140f"/>
    <text x="280" y="840" font-size="30" fill="#ffffff" text-anchor="middle">Webシステムで納品</text>
    <rect x="510" y="790" width="490" height="78" rx="4" fill="#faf9f7" stroke="#e7e5e0" stroke-width="2"/>
    <text x="755" y="840" font-size="30" fill="#14140f" text-anchor="middle">文科省ガイドライン6種（RAG）</text>
    <rect x="1030" y="790" width="490" height="78" rx="4" fill="#faf9f7" stroke="#e7e5e0" stroke-width="2"/>
    <text x="1275" y="840" font-size="30" fill="#14140f" text-anchor="middle">児童氏名のマスキング</text>
  </g>
</svg>
